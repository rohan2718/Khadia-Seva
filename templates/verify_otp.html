{% extends 'base.html' %}
{% block title %}Verify OTP - Khadia Seva{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div class="w-full max-w-lg bg-white shadow rounded-2xl p-6">
    <h1 class="text-2xl font-semibold mb-2">Verify OTP</h1>
    <p class="text-sm text-slate-500 mb-6">OTP is simulated for this MVP.</p>

    <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-sm mb-1">OTP</label>
        <input type="text" name="otp" maxlength="6" required class="w-full border rounded-lg px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm mb-1">Name</label>
        <input type="text" name="name" class="w-full border rounded-lg px-3 py-2" placeholder="Your name" />
      </div>
      <div>
        <label class="block text-sm mb-1">Ward</label>
        <select name="ward" class="w-full border rounded-lg px-3 py-2">
          <option value="Khadia">Khadia</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm mb-1">Pincode (optional if ward=Khadia)</label>
        <input type="text" name="pincode" class="w-full border rounded-lg px-3 py-2" placeholder="e.g. 380001" />
      </div>
      <div class="md:col-span-2">
        <button class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Verify & Continue</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
